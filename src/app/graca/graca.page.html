<ion-header [translucent]="true">
  <ion-toolbar class="top1">
    <ion-buttons slot="end">
      <a style="text-decoration: none;" target="_blank" href="https://www.facebook.com/prefeiturademaragojipe">
        <ion-icon color=light button name="logo-facebook"></ion-icon>&nbsp;&nbsp;
      </a>
    </ion-buttons>

    <ion-buttons slot="end">
      <a style="text-decoration: none;" target="_blank"
        href="https://www.instagram.com/prefeiturademaragojipe/?hl=pt-br">
        <ion-icon color=light name="logo-instagram"></ion-icon> &nbsp;&nbsp;
      </a>
    </ion-buttons>

    <ion-buttons slot="end">
      <a style="text-decoration: none;" target="_blank" href="">
        <ion-icon color=light name="logo-youtube"></ion-icon>&nbsp;&nbsp;
      </a>
    </ion-buttons>
    <ion-title>
    </ion-title>
  </ion-toolbar>

  <ion-toolbar class="top2">
    <ion-grid>
      <ion-row *ngIf="alternar ==true">
        <ion-col size=3>
          <a style="text-decoration: none;" href="/">
            <img class="imagem" src="../../../assets/logo-prefeitura/logo4.png" alt="Prefeitura de Maragojipe">
          </a>
        </ion-col>
        <ion-col size=3>
          <ion-searchbar type="text" [(ngModel)]="pesquisa" (keyup.enter)="pesquisarNoticias()" class="inputAjuda"
            placeholder="O que deseja procurar ?"></ion-searchbar>
        </ion-col>
        <ion-col class="centralizarTexto" size=2>
          <ion-item button (click)='ir("/o-municipio")' color=transparent lines=none>
            <ion-label color=light>
              O MUNICIPIO
            </ion-label>
          </ion-item>
        </ion-col>
        <ion-col class="centralizarTexto" size=2>
          <ion-item button (click)='ir("/a-prefeitura")' color=transparent lines=none>
            <ion-label color=light>
              A PREFEITURA
            </ion-label>
          </ion-item>
        </ion-col>
        <ion-col class="centralizarTexto" size=2>
          <ion-item (click)='ir("/telefones-uteis")' button color=transparent lines=none>
            <ion-label color=light>
              TELEFONES ÚTEIS
            </ion-label>
          </ion-item>
        </ion-col>
      </ion-row>

      <ion-row *ngIf="alternar ==false" class="tamanho">
        <ion-col (click)='ir("/")' size=3>
          <img class="imagem2" src="../../../assets/logo-prefeitura/logo4.png" alt="Prefeitura de Maragojipe">
        </ion-col>
        <ion-col (click)='ir("/o-municipio")' size=3>
          <ion-label style="font-size: x-small;" color=light>
            O MUNICIPIO
          </ion-label>
        </ion-col>
        <ion-col (click)='ir("/a-prefeitura")' size=3>
          <ion-label style="font-size: x-small;" color=light>
            A PREFEITURA
          </ion-label>
        </ion-col>
        <ion-col (click)='ir("/telefones-uteis")' size=3>
          <ion-label style="font-size: x-small;" color=light>
            TELEFONES ÚTEIS
          </ion-label>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-header>
<ion-content>

  <ion-list-header style="text-align: justify;" *ngIf="ppa.length>0" lines="none">
    <ion-label color="dark">Não lidos</ion-label>
  </ion-list-header>

  <ion-list *ngFor="let c of naoPPA">
    <!-- Se o nao for lido e for  para PC -->
    <ion-item
      (click)="presentModal(c.id, c.nome, c.cpf,c.distrito, c.email, c.lido, c.comentario, c.escolha1, c.escolha2, c.escolha3)"
      *ngIf="alternar == true" style="margin-left: 10%;margin-right: 10%;" lines="none" button detail>
      <ion-icon color="dark" slot="start" name="menu-outline"></ion-icon>
      <ion-label color="dark">
        {{c.nome}}
      </ion-label>
    </ion-item>
    <!-- Se o nao for lido e for  para celular -->
    <ion-item
      (click)="presentModal(c.id, c.nome, c.cpf,c.distrito, c.email, c.lido, c.comentario, c.escolha1, c.escolha2, c.escolha3)"
      *ngIf="alternar ==false" lines="none" button detail>
      <ion-icon color="dark" slot="start" name="menu-outline"></ion-icon>
      <ion-label color="dark">
        {{c.nome}}
      </ion-label>
    </ion-item>
  </ion-list>



  <ion-list-header style="text-align: justify;" *ngIf="ppa.length>0" lines="none">
    <ion-label color="dark">Lidos</ion-label>
  </ion-list-header>
  <ion-list *ngFor="let c of ppa">
    <!--Se for para PC e ja foi lido-->
    <ion-item (click)="presentModal(c.id, c.nome, c.cpf,c.distrito, c.email, c.lido, c.comentario, c.escolha1, c.escolha2, c.escolha3)"
      *ngIf="alternar == true" style="margin-left: 10%;margin-right: 10%;" lines="none" button detail>
      <ion-icon color="primary" slot="start" name="checkmark-outline"></ion-icon>
      <ion-label color="primary">
        {{c.nome}}
      </ion-label>
    </ion-item>
    <!--Se for para celular e ja foi lido-->
    <ion-item (click)="presentModal(c.id, c.nome, c.cpf,c.distrito, c.email, c.lido, c.comentario, c.escolha1, c.escolha2, c.escolha3)"
      *ngIf="alternar ==false" lines="none" button detail>
      <ion-icon color="primary" slot="start" name="checkmark-outline"></ion-icon>
      <ion-label color="primary">
        {{c.nome}}
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
